[project]
name = "hypervault-mcp"
version = "0.3.0"
description = "HyperVault MCP server — let agents save artifacts, claim vanity domains, use the user's private memory wiki, and work shared task boards."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # <2.12 fails to import: this code uses fastmcp.server.dependencies
    # (get_http_headers/get_http_request, added in 2.12) and
    # FastMCP.http_app(stateless_http=..., json_response=...), neither of
    # which exists on fastmcp 2.0-2.11 — confirmed by installing several
    # versions in that range against a clean environment.
    "fastmcp>=2.12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "asgi-lifespan>=2.1.0",
]

[project.scripts]
hypervault-mcp = "hypervault_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypervault_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
